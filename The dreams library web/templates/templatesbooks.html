<!DOCTYPE html>
<html>
<head><title>{{ title }}</title></head>
<body style="background-color: #0f0f0f; color: white; font-family: Arial; margin: 0; display: flex; min-height: 100vh;">
    <div style="flex: 1; padding: 40px;">
        <h1>{{ title }}</h1>
        <a href="/main" style="color: #e94560; text-decoration: none;">← Volver al Inicio</a>
        <hr style="border-color: #333; margin: 20px 0;">
        
        {% if not books %}
            <p style="color: #888;">No hay libros en esta lista.</p>
        {% endif %}
        
        {% for b in books %}
        <div style="background-color: #1a1a2e; padding: 15px; margin-bottom: 15px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center;">
            <div>
                <h3 style="margin: 0 0 5px 0;">📖 {{ b.filename }}</h3>
                <p style="margin: 0; color: #ccc; font-size: 14px;">Autor: {{ b.author }} | Agregado: {{ b.date_added }}</p>
            </div>
            <div>
                <a href="/delete/{{ b._id }}" style="background: #cc3333; color: white; padding: 8px 15px; text-decoration: none; border-radius: 4px; font-size: 14px;">Eliminar</a>
            </div>
        </div>
        {% endfor %}
    </div>
    
    <!-- Menú Lateral -->
    <div style="width: 250px; background-color: #1a1a2e; display: flex; flex-direction: column; padding-top: 20px;">
        <a href="/main" style="color: white; background: #0f3460; padding: 15px; text-decoration: none; margin: 10px; text-align: center; border-radius: 5px;">Pantalla Principal</a>
        <a href="/books/all" style="color: white; background: #e94560; padding: 15px; text-decoration: none; margin: 10px; text-align: center; border-radius: 5px;">Mis Libros</a>
        <a href="/books/favorites" style="color: white; background: #0f3460; padding: 15px; text-decoration: none; margin: 10px; text-align: center; border-radius: 5px;">Libros Preferidos</a>
        <a href="/books/pending" style="color: white; background: #0f3460; padding: 15px; text-decoration: none; margin: 10px; text-align: center; border-radius: 5px;">Lista de Pendientes</a>
        <a href="/logout" style="color: white; background: #cc3333; padding: 15px; text-decoration: none; margin: 30px 10px 10px 10px; text-align: center; border-radius: 5px;">Cerrar Sesión</a>
    </div>
</body>
</html>
